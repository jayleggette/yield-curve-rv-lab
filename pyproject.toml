[project]
name = "yield-curve-rv-lab"
version = "1.0.0"
description = "Treasury curve fitting, PCA, term premium, and an honest out-of-sample butterfly backtest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jay Leggette" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
